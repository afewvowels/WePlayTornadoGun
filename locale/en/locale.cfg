[mod-setting-description]
wp-tornado-max-distance=The tornado slows and stops when it reaches this distance.
wp-tornado-capacity=The tornado also slows and stops once it is holding this many enemies.
wp-tornado-fall-damage=Impact damage dealt to each enemy when the tornado collapses and drops it.
wp-tornado-dust-radius=Enemies anywhere in the dust cloud get grabbed and dragged in.
wp-tornado-funnel-radius=Grabbed enemies swirl around the edge of the funnel. Also sets how big the tornado graphic is.
wp-tornado-swirl-dps=Average damage per second to each enemy while it swirls. Each enemy takes between half and one and a half times this, so they don't all die at once.
